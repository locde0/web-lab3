<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Факультет{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #333; color: white; padding: 15px; }
        header a { color: white; text-decoration: none; margin-right: 15px; }
        header a:hover { text-decoration: underline; }
        .container { padding: 20px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'departments' %}">Кафедри</a>
        <a href="{% url 'programs' %}">Спеціальності</a>
        <a href="{% url 'exchange' %}">Програми обміну</a>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
